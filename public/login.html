<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیریت | ایران برد</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="/"><span>IB</span> ایران برد</a></header><main class="login-wrap"><section class="login-card"><div class="login-mark">♙</div><span class="eyebrow">ADMIN ACCESS</span><h1>ورود به پنل مدیریت</h1><p>مدیر کل و کارکنان از این بخش وارد سامانه سفارش‌ها می‌شوند.</p><form id="lf"><label>نام کاربری<input id="u" autocomplete="username" required></label><label>رمز عبور<input id="p" type="password" autocomplete="current-password" required></label><button class="btn full">ورود به پنل</button></form><div id="err"></div></section></main><script>
lf.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(!r.ok){err.innerHTML='<div class="errorbox">نام کاربری یا رمز عبور صحیح نیست.</div>';return}let j=await r.json();localStorage.setItem('ib_token',j.token);localStorage.setItem('ib_user',JSON.stringify(j.user));location.href='admin.html'}
</script></body></html>
