<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیگیری سفارش | ایران برد</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html"><b>IB</b>ایران برد</a><a class="btn" href="order.html">ثبت سفارش</a></header><main class="app"><div class="panel trackbox"><div class="title"><span class="eyebrow">پیگیری بدون ورود</span><h2>وضعیت سفارش</h2></div><form id="track"><label>کد پیگیری<input id="tracking" required placeholder="IB-260915-1234" style="direction:ltr"></label><button class="btn" style="width:100%">بررسی وضعیت</button></form><div id="result" class="result"></div></div></main><script>document.getElementById('track').onsubmit=async e=>{e.preventDefault();let c=document.getElementById('tracking').value.trim(),r=await fetch('/api/track/'+encodeURIComponent(c)),box=document.getElementById('result');if(!r.ok){box.innerHTML='<div class="notice">سفارشی با این کد پیدا نشد.</div>';return}let {order:o}=await r.json();box.innerHTML=`<div class="notice"><b>وضعیت: ${o.status}</b><br>مشتری: ${o.customer.name}<br>شرکت: ${o.customer.company||'-'}<br>تعداد: ${o.pcb.qty||'-'}<br>${o.price?'<b>قیمت اعلام‌شده: '+Number(o.price).toLocaleString('fa-IR')+' تومان</b>':'قیمت هنوز توسط مدیر اعلام نشده است.'}</div>`}</script></body></html>
