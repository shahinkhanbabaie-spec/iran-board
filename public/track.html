<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیگیری سفارش | ایران برد</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="/"><span>IB</span> ایران برد</a><a class="btn" href="order.html">ثبت سفارش</a></header><main class="app"><section class="form-card"><div class="section-title right"><span>پیگیری بدون ورود</span><h2>وضعیت سفارش</h2></div><form id="track"><label>کد پیگیری<input id="tracking" required placeholder="IB-260915-1234" style="direction:ltr"></label><button class="btn full">بررسی وضعیت</button></form><div id="result"></div></section></main><script>
let code='';track.onsubmit=async e=>{e.preventDefault();code=tracking.value.trim();await show()};
async function show(){let r=await fetch('/api/track/'+encodeURIComponent(code));if(!r.ok){result.innerHTML='<div class="review">سفارشی با این کد پیدا نشد.</div>';return}let {order:o}=await r.json();let msgs=(o.messages||[]).map(x=>`<div class="msg ${x.from}"><b>${x.from==='admin'?'پیام ایران برد':'پاسخ شما'}:</b> ${x.text}</div>`).join('');result.innerHTML=`<div class="review"><h3>وضعیت: ${o.status}</h3><p>پروژه: ${o.project.title||'-'}<br>مشتری: ${o.customer.name}<br>شرکت: ${o.customer.company||'-'}<br>کد پیگیری: <b>${o.tracking}</b>${o.price?`<br>قیمت اعلام‌شده: <b>${o.price}</b>`:''}</p></div><h3>پیام‌ها و درخواست‌های تکمیلی</h3><div class="msgbox">${msgs||'هنوز پیامی ثبت نشده است.'}</div>${o.status.includes('تکمیل')?`<form id="reply" enctype="multipart/form-data"><label>پاسخ شما<textarea name="text" placeholder="توضیحات تکمیلی را بنویسید..."></textarea></label><label class="drop compact">افزودن فایل یا تصویر تکمیلی<input type="file" name="extraFiles" multiple></label><button class="btn full">ارسال اطلاعات تکمیلی</button></form>`:''}`;let f=document.getElementById('reply');if(f)f.onsubmit=async e=>{e.preventDefault();let rr=await fetch('/api/orders/'+encodeURIComponent(code)+'/reply',{method:'POST',body:new FormData(f)});if(rr.ok){alert('اطلاعات تکمیلی ارسال شد.');await show()}}}
</script></body></html>
