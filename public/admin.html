<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | ایران برد</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="/"><span>IB</span> پنل مدیریت ایران برد</a><button class="btn ghost" onclick="load()">بروزرسانی</button></header><main class="admin-layout"><section><div class="toolbar"><h2 style="margin-left:auto">سفارش‌ها</h2><select id="filter" onchange="render()"><option value="">همه وضعیت‌ها</option><option>در انتظار بررسی</option><option>نیازمند تکمیل</option><option>اطلاعات تکمیلی دریافت شد</option><option>قیمت‌گذاری شده</option></select></div><div class="orders" id="orders"></div></section><aside class="agent"><span class="eyebrow" style="color:#78d7c4">IRAN BOARD AGENT • BETA</span><h2>دستیار مدیر</h2><p style="color:#c6d8d4;font-size:13px">از سفارش‌های ثبت‌شده سؤال بپرس؛ فعلاً به‌صورت آزمایشی و بدون سرویس پولی AI.</p><div class="agent-output" id="agentout">برای شروع بپرس: «چند سفارش جدید دارم؟» یا «کدام‌ها نیازمند تکمیل هستند؟»</div><input id="agentq" placeholder="سؤال درباره سفارش‌ها..."><button class="btn full" style="margin-top:9px" onclick="askAgent()">پرسیدن از Agent</button></aside></main><script>
let all=[];async function load(){all=await (await fetch('/api/admin/orders')).json();render()}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let f=filter.value,a=f?all.filter(x=>x.status===f):all;orders.innerHTML=a.length?a.map(o=>`<article class="order-card"><div class="order-head"><div><b>${esc(o.project.title||'بدون عنوان')}</b><div style="font-size:12px;color:#6d7b82">${esc(o.tracking)} • ${esc(o.customer.name)} • ${esc(o.customer.phone)}</div></div><span class="badge">${esc(o.status)}</span></div><p style="font-size:13px;color:#5f7076">شرکت: ${esc(o.customer.company||'-')} | تعداد: ${esc(o.project.quantity||'-')} | لایه: ${esc(o.project.layers||'-')}<br>فایل‌ها: ${(o.files||[]).map(x=>esc(x.name)).join('، ')||'ندارد'}</p><div class="grid2"><label>وضعیت<select id="s${o.id}"><option ${o.status==='در انتظار بررسی'?'selected':''}>در انتظار بررسی</option><option ${o.status==='نیازمند تکمیل'?'selected':''}>نیازمند تکمیل</option><option ${o.status==='اطلاعات تکمیلی دریافت شد'?'selected':''}>اطلاعات تکمیلی دریافت شد</option><option ${o.status==='قیمت‌گذاری شده'?'selected':''}>قیمت‌گذاری شده</option></select></label><label>قیمت / مبلغ پیش‌فاکتور<input id="p${o.id}" value="${esc(o.price||'')}" placeholder="مثلاً 25,000,000 تومان"></label></div><label>پیام برای مشتری<textarea id="m${o.id}" placeholder="مثلاً لطفاً فایل شماتیک یا تصویر واضح‌تری ارسال کنید..."></textarea></label><div class="actions"><button class="btn" onclick="save(${o.id})">ذخیره وضعیت و قیمت</button><button class="btn ghost" onclick="send(${o.id})">ارسال پیام به مشتری</button></div>${(o.messages||[]).length?`<div class="msgbox">${o.messages.map(x=>`<div class="msg ${x.from}">${x.from==='admin'?'مدیر':'مشتری'}: ${esc(x.text)}</div>`).join('')}</div>`:''}</article>`).join(''):'<div class="review">سفارشی وجود ندارد.</div>'}
async function save(id){let r=await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:document.getElementById('s'+id).value,price:document.getElementById('p'+id).value})});if(r.ok){alert('ذخیره شد');load()}}
async function send(id){let text=document.getElementById('m'+id).value.trim();if(!text)return alert('اول پیام را بنویسید.');let status=document.getElementById('s'+id).value;let r=await fetch('/api/admin/orders/'+id+'/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,status})});if(r.ok){alert('پیام ثبت شد و مشتری در پیگیری سفارش آن را می‌بیند.');load()}}
async function askAgent(){let q=agentq.value.trim(),s=await (await fetch('/api/admin/agent')).json(),ans=`در مجموع ${s.total} سفارش دارید؛ ${s.new} سفارش در انتظار بررسی و ${s.need} سفارش نیازمند تکمیل است.`;if(/تکمیل/.test(q)){let a=all.filter(x=>x.status.includes('تکمیل'));ans=a.length?'سفارش‌های مرتبط با تکمیل: '+a.map(x=>x.tracking+' - '+(x.customer.name||'')).join(' | '):'فعلاً سفارشی در وضعیت تکمیل ندارید.'}else if(/جدید|انتظار/.test(q)){let a=all.filter(x=>x.status==='در انتظار بررسی');ans=a.length?'سفارش‌های جدید: '+a.map(x=>x.tracking+' - '+(x.project.title||'بدون عنوان')).join(' | '):'سفارش جدیدی در انتظار بررسی نیست.'}else if(/قیمت/.test(q)){ans=`تعداد سفارش‌هایی که قیمت برایشان ثبت شده: ${s.priced}`};agentout.textContent=ans}
load();
</script></body></html>
