<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | ایران برد</title><link rel="stylesheet" href="style.css"></head><body class="admin-body"><header class="nav"><a class="brand" href="/"><span>IB</span> ایران برد</a><b>پنل مدیریت</b></header><main class="app"><div class="dash-head"><div><span class="eyebrow">مدیریت سفارش‌ها</span><h1>سفارش‌های ایران برد</h1></div><button class="btn" onclick="toggleAgent()">دستیار مدیر AI</button></div><section class="table-card"><div class="table-wrap"><table><thead><tr><th>کد</th><th>مشتری</th><th>شرکت</th><th>تعداد</th><th>وضعیت</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="detail" class="form-card" style="display:none;margin-top:20px"></section></main><button class="float-agent" onclick="toggleAgent()">AI</button><div class="agentbox" id="agent"><b>دستیار مدیر ایران برد</b><p class="answer" id="aa">مثلاً بپرس: «کدام سفارش‌ها نیازمند تکمیل هستند؟»</p><textarea id="aq" placeholder="سؤال درباره سفارش‌ها..."></textarea><button class="btn full" onclick="askAgent()">بپرس</button></div><script>
let orders=[],current=null;
async function load(){orders=await (await fetch('/api/admin/orders')).json();rows.innerHTML=orders.map(o=>`<tr><td>${o.tracking}</td><td>${o.customer.name}</td><td>${o.customer.company||'-'}</td><td>${o.pcb.qty||'-'}</td><td>${o.status}</td><td><button class="linkbtn" onclick="openO('${o.id}')">باز کردن</button></td></tr>`).join('')}
function openO(id){current=orders.find(x=>String(x.id)===String(id));let m=(current.messages||[]).map(x=>`<div class="msg ${x.from}"><b>${x.from==='admin'?'مدیر':'مشتری'}:</b> ${x.text}</div>`).join('');detail.style.display='block';detail.innerHTML=`<span class="eyebrow">${current.tracking}</span><h2>${current.customer.name} — ${current.customer.mobile}</h2><p>شرکت: ${current.customer.company||'-'} | تعداد: ${current.pcb.qty||'-'} | وضعیت: <b>${current.status}</b></p><h3>پیام‌ها</h3><div class="msgbox">${m||'هنوز پیامی وجود ندارد.'}</div><label>وضعیت<select id="st"><option>در انتظار بررسی</option><option>نیازمند تکمیل</option><option>اطلاعات تکمیلی دریافت شد</option><option>در حال قیمت‌گذاری</option><option>پیش‌فاکتور ارسال شد</option><option>در تولید</option><option>آماده تحویل</option></select></label><label>پیام برای مشتری<textarea id="mt" placeholder="مثلاً: لطفاً تصویر واضح‌تر از برد و فایل SchDoc را ارسال کنید."></textarea></label><button class="btn" onclick="sendMsg()">ثبت وضعیت و ارسال پیام</button>`;st.value=current.status;detail.scrollIntoView({behavior:'smooth'})}
async function sendMsg(){let text=mt.value.trim(),status=st.value;if(!text)return alert('پیام برای مشتری را بنویسید.');await fetch('/api/admin/orders/'+current.id+'/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,status})});alert('پیام ثبت شد و در صفحه پیگیری مشتری نمایش داده می‌شود.');await load();openO(current.id)}
function toggleAgent(){agent.classList.toggle('show')}
async function askAgent(){let r=await fetch('/api/admin/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:aq.value})});let j=await r.json();aa.textContent=j.answer}
load();</script></body></html>
