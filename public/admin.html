<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | ایران برد</title><link rel="stylesheet" href="style.css"></head><body class="admin"><header class="nav"><a class="brand" href="index.html"><b>IB</b>پنل مدیریت ایران برد</a><button class="btn" onclick="agent()">دستیار مدیر</button></header><main class="adminmain"><div class="kpis"><div>کل سفارش‌ها<b id="all">0</b></div><div>در انتظار بررسی<b id="waiting">0</b></div><div>قیمت‌گذاری شده<b id="priced">0</b></div></div><div class="panel"><h2>سفارش‌ها</h2><div class="tablewrap"><table><thead><tr><th>کد</th><th>مشتری</th><th>موبایل</th><th>شرکت</th><th>تعداد</th><th>وضعیت</th><th>اقدام</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="panel" style="margin-top:18px"><h3>دستیار مدیر</h3><div id="agent" class="notice">در نسخه فعلی، دستیار یک تحلیل محلی نمونه از سفارش‌ها ارائه می‌دهد. اتصال AI واقعی را می‌توان در مرحله بعد اضافه کرد.</div></div></main><div class="drawer" id="drawer"><div><button class="outline" onclick="closeD()">بستن</button><h2 id="dt"></h2><div id="detail"></div><label>وضعیت<select id="status"><option>در انتظار بررسی</option><option>نیازمند تکمیل اطلاعات</option><option>در حال قیمت‌گذاری</option><option>پیش‌فاکتور آماده</option><option>تأیید مشتری</option><option>در تولید</option><option>آماده تحویل</option></select></label><label>قیمت نهایی (تومان)<input id="price" type="number"></label><button class="btn" onclick="save()">ذخیره تغییرات</button></div></div><script>let orders=[],current=null;async function load(){orders=await (await fetch('/api/admin/orders')).json();all.textContent=orders.length;waiting.textContent=orders.filter(x=>x.status==='در انتظار بررسی').length;priced.textContent=orders.filter(x=>x.price).length;rows.innerHTML=orders.map(o=>`<tr><td style="direction:ltr">${o.tracking}</td><td>${o.customer.name}</td><td>${o.customer.mobile}</td><td>${o.customer.company||'-'}</td><td>${o.pcb.qty||'-'}</td><td><span class="status">${o.status}</span></td><td><button class="link" onclick="openD(${o.id})">بررسی / قیمت</button></td></tr>`).join('')}function openD(id){current=orders.find(x=>x.id===id);dt.textContent=current.tracking;detail.innerHTML=`<p>مشتری: <b>${current.customer.name}</b> — ${current.customer.mobile}</p><p>برد: ${current.pcb.layers||'-'} | ابعاد: ${current.pcb.size||'-'} | تعداد: ${current.pcb.qty||'-'}</p><p>فایل‌ها: ${current.files.map(x=>x.name).join('، ')||'بدون فایل'}</p><p>${current.pcb.notes||''}</p>`;status.value=current.status;price.value=current.price||'';drawer.style.display='grid'}function closeD(){drawer.style.display='none'}async function save(){await fetch('/api/admin/orders/'+current.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:status.value,price:price.value?Number(price.value):null})});closeD();load()}function agent(){let missing=orders.filter(x=>!x.files.length),urgent=orders.filter(x=>x.status==='در انتظار بررسی');document.getElementById('agent').innerHTML=`<b>خلاصه سفارش‌ها:</b><br>${urgent.length} سفارش در انتظار بررسی است.<br>${missing.length} سفارش هیچ فایلی ندارد و بهتر است ابتدا با مشتری پیگیری شود.`}load()</script></body></html>
