<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | ایران برد</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="/"><span>IB</span> پنل مدیریت</a><div class="admin-user"><span id="who"></span><button class="btn ghost" onclick="logout()">خروج</button></div></header><main class="admin-layout"><section><div class="toolbar"><h2 style="margin-left:auto">سفارش‌ها</h2><button id="userBtn" class="btn ghost" style="display:none" onclick="usersBox.classList.toggle('show')">+ ساخت کارمند</button><select id="filter" onchange="render()"><option value="">همه وضعیت‌ها</option><option>در انتظار بررسی</option><option>نیازمند تکمیل</option><option>اطلاعات تکمیلی دریافت شد</option><option>قیمت‌گذاری شده</option></select></div><div id="usersBox" class="userbox"><h3>ساخت حساب کارمند</h3><div class="grid2"><label>نام کارمند<input id="en"></label><label>نام کاربری<input id="eu"></label><label>رمز عبور<input id="ep" type="password"></label></div><button class="btn" onclick="createUser()">ساخت حساب</button><div id="userList"></div></div><div class="orders" id="orders"></div></section><aside class="agent"><span class="eyebrow" style="color:#78d7c4">IRAN BOARD AGENT • BETA</span><h2>دستیار مدیر</h2><p style="color:#c6d8d4;font-size:13px">خلاصه سفارش‌های ثبت‌شده را از اینجا بپرس.</p><div class="agent-output" id="agentout">مثلاً: «چند سفارش جدید دارم؟»</div><input id="agentq" placeholder="سؤال درباره سفارش‌ها..."><button class="btn full" style="margin-top:9px" onclick="askAgent()">پرسیدن</button></aside></main><script>
const token=localStorage.getItem('ib_token');if(!token)location.replace('login.html');const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};let all=[],me=null;
async function init(){let r=await fetch('/api/me',{headers:H});if(!r.ok){localStorage.clear();location.replace('login.html');return}me=(await r.json()).user;who.textContent=(me.role==='superadmin'?'مدیر کل: ':'کارمند: ')+(me.name||me.username);if(me.role==='superadmin'){userBtn.style.display='inline-flex';loadUsers()}await load()}
async function load(){let r=await fetch('/api/admin/orders',{headers:H});if(r.status===401)return logout();all=await r.json();render()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let f=filter.value,a=f?all.filter(x=>x.status===f):all;orders.innerHTML=a.length?a.map(o=>{let hist=(o.messages||[]).map(x=>`<div class="msg ${x.from}"><div class="msgmeta"><b>${esc(x.from==='admin'?(x.name||'مدیر'):'مشتری')}</b><span>${x.at?new Date(x.at).toLocaleString('fa-IR'):''}</span></div><div>${esc(x.text)}</div></div>`).join('');return `<article class="order-card"><div class="order-head"><div><b>${esc(o.project.title||'بدون عنوان')}</b><div style="font-size:12px;color:#6d7b82">${esc(o.tracking)} • ${esc(o.customer.name)} • ${esc(o.customer.phone)}</div></div><span class="badge">${esc(o.status)}</span></div><p style="font-size:13px;color:#5f7076">شرکت: ${esc(o.customer.company||'-')} | تعداد: ${esc(o.project.quantity||'-')} | لایه: ${esc(o.project.layers||'-')}</p><div class="grid2"><label>وضعیت<select id="s${o.id}"><option ${o.status==='در انتظار بررسی'?'selected':''}>در انتظار بررسی</option><option ${o.status==='نیازمند تکمیل'?'selected':''}>نیازمند تکمیل</option><option ${o.status==='اطلاعات تکمیلی دریافت شد'?'selected':''}>اطلاعات تکمیلی دریافت شد</option><option ${o.status==='قیمت‌گذاری شده'?'selected':''}>قیمت‌گذاری شده</option></select></label><label>قیمت<input id="p${o.id}" value="${esc(o.price||'')}" placeholder="مثلاً 25,000,000 تومان"></label></div><div class="conversation"><h4>تاریخچه گفتگو</h4>${hist||'<p class="empty">هنوز پیامی ردوبدل نشده است.</p>'}</div><label>پیام جدید برای مشتری<textarea id="m${o.id}" placeholder="پیام شما در صفحه پیگیری مشتری نمایش داده می‌شود..."></textarea></label><div class="actions"><button class="btn" onclick="send(${o.id})">ارسال پیام</button><button class="btn ghost" onclick="save(${o.id})">ذخیره وضعیت و قیمت</button></div></article>`}).join(''):'<div class="review">سفارشی وجود ندارد.</div>'}
async function save(id){let r=await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:H,body:JSON.stringify({status:document.getElementById('s'+id).value,price:document.getElementById('p'+id).value})});if(r.ok){alert('ذخیره شد');load()}}
async function send(id){let text=document.getElementById('m'+id).value.trim();if(!text)return alert('پیام را بنویسید.');let r=await fetch('/api/admin/orders/'+id+'/message',{method:'POST',headers:H,body:JSON.stringify({text,status:document.getElementById('s'+id).value})});if(r.ok){alert('پیام در تاریخچه سفارش ثبت شد.');load()}else alert('ارسال انجام نشد.')}
async function loadUsers(){let r=await fetch('/api/admin/users',{headers:H});if(!r.ok)return;let a=await r.json();userList.innerHTML='<h4>کاربران</h4>'+a.map(x=>`<div class="userrow"><b>${esc(x.name)}</b><span>${esc(x.username)} — ${x.role==='superadmin'?'مدیر کل':'کارمند'}</span></div>`).join('')}
async function createUser(){if(!eu.value||!ep.value)return alert('نام کاربری و رمز را وارد کنید.');let r=await fetch('/api/admin/users',{method:'POST',headers:H,body:JSON.stringify({name:en.value,username:eu.value,password:ep.value})});if(r.status===409)return alert('این نام کاربری قبلاً وجود دارد.');if(r.ok){en.value=eu.value=ep.value='';alert('حساب کارمند ساخته شد.');loadUsers()}}
async function askAgent(){let s=await (await fetch('/api/admin/agent',{headers:H})).json(),q=agentq.value,ans=`در مجموع ${s.total} سفارش دارید؛ ${s.new} سفارش در انتظار بررسی و ${s.need} سفارش مرتبط با تکمیل است.`;if(/تکمیل/.test(q)){let a=all.filter(x=>x.status.includes('تکمیل'));ans=a.length?a.map(x=>x.tracking+' — '+x.customer.name).join(' | '):'موردی نیست.'}agentout.textContent=ans}
async function logout(){try{await fetch('/api/logout',{method:'POST',headers:H})}catch(e){}localStorage.removeItem('ib_token');localStorage.removeItem('ib_user');location.replace('login.html')}
init();
</script></body></html>
