<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت سفارش PCB | ایران برد</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="/"><span>IB</span> ایران برد</a><a class="btn ghost" href="track.html">پیگیری سفارش</a></header><main class="app"><section class="form-card"><div class="section-title right"><span>بدون نیاز به ثبت‌نام</span><h2>ثبت سفارش PCB</h2><p style="margin:0">اطلاعات تماس، مشخصات فنی و فایل‌های پروژه را ارسال کنید.</p></div><form id="form" enctype="multipart/form-data"><div class="grid2"><label>نام و نام خانوادگی*<input name="name" required></label><label>شماره موبایل*<input name="phone" required placeholder="09xxxxxxxxx"></label><label>نام شرکت<input name="company"></label><label>ایمیل<input name="email" type="email"></label></div><hr style="border:0;border-top:1px solid #e4eceb;width:100%"><div class="grid2"><label>عنوان پروژه*<input name="title" required placeholder="مثلاً برد کنترل صنعتی"></label><label>تعداد<input name="quantity" type="number" min="1"></label><label>تعداد لایه<select name="layers"><option>1</option><option>2</option><option>4</option><option>6</option><option>8</option><option>10+</option></select></label><label>متریال<select name="material"><option>FR-4</option><option>Aluminum</option><option>سایر</option></select></label><label>ضخامت برد<input name="thickness" placeholder="مثلاً 1.6mm"></label><label>ضخامت مس<input name="copper" placeholder="مثلاً 1oz"></label><label>پوشش نهایی<select name="finish"><option>HASL</option><option>Lead Free HASL</option><option>ENIG</option><option>سایر</option></select></label></div><label>توضیحات<textarea name="notes" placeholder="هر نکته فنی یا زمان تحویل موردنظر..."></textarea></label><label class="drop">فایل‌های Altium پروژه — PcbDoc / SchDoc / PrjPcb / ZIP / RAR<input type="file" name="altiumFiles" multiple accept=".PcbDoc,.SchDoc,.PrjPcb,.PcbLib,.SchLib,.zip,.rar,.7z"></label><label class="drop">تصاویر و مستندات تصویری<input type="file" name="imageFiles" multiple accept="image/*,.pdf"></label><button class="btn full">ثبت سفارش و دریافت کد پیگیری</button></form><div id="done"></div></section></main><script>
form.onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;b.textContent='در حال ثبت...';try{let r=await fetch('/api/orders',{method:'POST',body:new FormData(form)});let j=await r.json();if(!r.ok)throw 0;form.style.display='none';done.innerHTML=`<div class="review"><h2>سفارش ثبت شد ✓</h2><p>کد پیگیری شما:</p><h2 style="direction:ltr;color:#0d8b78">${j.tracking}</h2><p>این کد را نگه دارید. برای مشاهده وضعیت و پیام‌های ایران برد از بخش پیگیری سفارش استفاده کنید.</p><a class="btn" href="track.html">پیگیری سفارش</a></div>`}catch(x){alert('ثبت سفارش انجام نشد. دوباره تلاش کنید.');b.disabled=false;b.textContent='ثبت سفارش و دریافت کد پیگیری'}}
</script></body></html>
